name: "Propose a conjecture"
description: "State a testable meaning or function claim and deciding predictions."
title: "Conjecture: "
body:
  - type: markdown
    attributes:
      value: "Read CONTRIBUTING.md. Link source records and keep acquired images, sign sequences and third-party passages out of this issue."
  - type: textarea
    id: claim
    attributes:
      label: "Claim, area and credence"
      description: "Write the claim plainly and give a probability from 0 to 1."
    validations:
      required: true
  - type: textarea
    id: basis
    attributes:
      label: "Evidence and earlier proposals"
      description: "Link findings and prior proposals, with source scope."
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: "Predictions, pass rules and kill condition"
      description: "Follow knowledge/conjectures/README.md and the two-stage design; include a prospective prediction."
    validations:
      required: true
